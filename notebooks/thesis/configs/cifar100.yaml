# User-selected TensorFlow 2.20 recipe. Same platform across all five conditions.
base_config: ../../../semantic_consolidation/configs/common_v1.yaml
common:
  dataset:
    name: cifar100
    batch_size: 128
  model:
    kwargs:
      dim: 128
      depth: 6
      patchify_with_cnn: true
      clf_depth: 6
    wrapper_kwargs:
      mask_by_nulls: false
      clf_train_noisy_input_type: noisy
      clf_train_class_input_type: null_class_only
      noise_loss_coef: 1.0
      clf_loss_coef: 1.0
      noise_distil_loss_coef: 0.1
      clf_distil_loss_coef: 0.1
      clf_distil_type: soft
      clf_distil_temperature: 2.0
      clf_distil_scope: replay_only
      test_steps: 1000
      test_eta: 1.0
      test_cfg_scale: 3.0
  optimizer:
    name: adam
    initial_learning_rate: 0.005
    weight_decay: 0.0
    schedule: cosine
    # 86,150 joint updates + the 30,000-update extra-joint allowance.
    # Shared global optimizer clock; no restart at task boundaries.
    decay_steps: 116150
  training:
    epochs: 50
    verbose: 1
    deterministic_ops: false
    results_path: ./results/thesis_route_one/development/cifar100
  continually_learn:
    save_task_checkpoints: true  # Dedicated per-stream locators are set at runtime.
    class_num: 100
    class_order: null
    task_size: 10
    replay_budget_mode: match_current
    replay_current_examples: null
    replay_old_examples: null
    use_ensemble_accuracy: true
    evaluate_ensemble_accuracy: true
    ensemble_accuracy_kwargs:
      network_name: raw
      max_t: 256
      t_range_drop_rate: 0.5
      clf_distil_acc_coef: 0.5
      clf_acc_coef: 0.5
    mechanistic_metrics: false
route:
  image_augmentation: tmcl
  augmentation_views: 4
  checkpoint_interval: 200  # Same fixed recovery policy across paired conditions.
  condition: learned
  acquisition_steps: 1000  # 100 updates per new gate, cycling over ten new classes.
  consolidation_steps: 2000  # 20 visits per gate with 100 retained gates at task ten.
  batch_size: 32
  learning_rate: 0.0003
  temperature: 0.2
  alignment_weight: 0.1
  ce_weight: 1.0
  orthogonality_weight: 1.0
  gain_limit: 1.0
  bias_limit: 1.0
  modulation_init_std: 0.02
  acquisition_noise_level: 0
  ce_noise_level: 0
  noise_levels: [0]
  reliability: uniform
  consolidation_scope: semantic
  probe_batches: 2
  probe_max_gates: 4
  experimental:
    enabled: true
    probe_per_class: 8
    generation_per_class: 4
    batch_size: 32
    ece_bins: 15
    feature_extractor: fixed_pixels
    # Native joint histories already supply curves; avoid extra full-validation passes.
    learning_curves: false
