# Ten ten-class increments. Capacity is shared with the CIFAR-10 platform.
base_config: common_v1.yaml
common:
  dataset:
    name: cifar100
  continually_learn:
    class_num: 100
    class_order: null
    task_size: 10
  training:
    results_path: ./results/semantic_consolidation_cifar100
route:
  condition: learned
  acquisition_steps: 100
  consolidation_steps: 100
  batch_size: 32
  noise_levels: [0]
  reliability: alpha_bar
  consolidation_scope: semantic
