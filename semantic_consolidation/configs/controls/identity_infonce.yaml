# Existing random control with zero raw gain/bias: m_c(h) = h for every class.
# Acquisition still executes with zero learning rate; consolidation uses InfoNCE.
base_config: ../common_v1.yaml
route:
  condition: random
  modulation_init_std: 0.0
  acquisition_steps: 100
  consolidation_steps: 100
  batch_size: 32
  noise_levels: [0]
